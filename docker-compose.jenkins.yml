# Jenkins deploy: bind only on localhost, non-default ports (no clash with 8080/5432/6379).
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  api:
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      MYUTILS_CORS_ALLOWED_ORIGINS: "http://127.0.0.1:13082,http://localhost:13082,http://localhost:5173,http://127.0.0.1:5173"
