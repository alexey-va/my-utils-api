# Jenkins deploy: bind only on localhost, non-default ports (no clash with 8080/5432/6379).
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  api:
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      MYUTILS_CORS_ALLOWED_ORIGINS: "${MYUTILS_CORS_ALLOWED_ORIGINS}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS}"
      TELEGRAM_WEBHOOK_BASE_URL: "${TELEGRAM_WEBHOOK_BASE_URL:-https://utils.alexeyav.ru}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
