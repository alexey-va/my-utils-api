# Jenkins deploy: bind only on localhost, non-default ports (no clash with 8080/5432/6379).
# Telegram: long polling via getUpdates.
services:
  postgres:
    ports:
      - "127.0.0.1:15432:5432"

  redis:
    ports:
      - "127.0.0.1:16379:6379"

  temporal:
    ports:
      - "127.0.0.1:17233:7233"

  temporal-ui:
    ports:
      - "127.0.0.1:18233:8080"
    environment:
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      TEMPORAL_CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173,https://utils.alexeyav.ru,http://utils.alexeyav.ru,https://temporal.alexeyav.ru,http://temporal.alexeyav.ru"

  api:
    ports:
      - "127.0.0.1:18080:8080"
    environment:
      MYUTILS_CORS_ALLOWED_ORIGINS: "${MYUTILS_CORS_ALLOWED_ORIGINS}"
      MYUTILS_TELEGRAM_ENABLED: "${MYUTILS_TELEGRAM_ENABLED:-true}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      TELEGRAM_ALLOWED_USER_IDS: "${TELEGRAM_ALLOWED_USER_IDS}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      OPENROUTER_PROXY_ENABLED: "true"
      OPENROUTER_PROXY_HOST: "185.242.106.81"
      OPENROUTER_PROXY_PORT: "8888"
      MYUTILS_TEMPORAL_ENABLED: "true"
      TEMPORAL_TARGET: "temporal:7233"
