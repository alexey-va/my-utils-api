server:
  port: 8080

spring:
  application:
    name: my-utils-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myutils}
    username: ${POSTGRES_USER:myutils}
    password: ${POSTGRES_PASSWORD:myutils}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

myutils:
  jwt:
    secret: change-me-in-production-use-long-random-string-at-least-32-chars
    expiration-hours: 24
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://127.0.0.1:5173
  session:
    redis-key-prefix: "myutils:session:"
