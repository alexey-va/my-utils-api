server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
  metrics:
    tags:
      application: my-utils-api
    distribution:
      percentiles-histogram:
        agent.turn.duration: true
        agent.llm.step.duration: true
        agent.tool.duration: true

logging:
  level:
    dev.myutils.api: INFO
    org.flywaydb: WARN
    org.hibernate: WARN
    org.springframework: WARN
    org.springframework.web.servlet: WARN
    io.temporal.internal: WARN
    com.zaxxer.hikari: WARN
    org.apache.catalina: WARN
    org.apache.tomcat: WARN
  structured:
    format:
      console: logstash
    json:
      exclude:
        - "@version"
        - thread_name
        - level_value

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: my-utils-api
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:myutils}
    username: ${POSTGRES_USER:myutils}
    password: ${POSTGRES_PASSWORD:myutils}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  temporal:
    connection:
      enable: ${MYUTILS_TEMPORAL_ENABLED:false}
      target: ${TEMPORAL_TARGET:127.0.0.1:7233}
    namespace: default
    workers-auto-discovery:
      packages:
        - dev.myutils.api.temporal

myutils:
  jwt:
    secret: change-me-in-production-use-long-random-string-at-least-32-chars
    expiration-hours: 24
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173
      - http://127.0.0.1:5173
  session:
    redis-key-prefix: "myutils:session:"
  telegram:
    enabled: ${MYUTILS_TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    allowed-user-ids: ${TELEGRAM_ALLOWED_USER_IDS:}
  temporal:
    enabled: ${MYUTILS_TEMPORAL_ENABLED:false}
    task-queue: myutils-main
  openrouter:
    api-key: ${OPENROUTER_API_KEY:}
    proxy:
      enabled: ${OPENROUTER_PROXY_ENABLED:false}
      host: ${OPENROUTER_PROXY_HOST:}
      port: ${OPENROUTER_PROXY_PORT:8888}
