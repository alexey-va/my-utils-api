spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/${TEST_POSTGRES_DB:myutils}
    username: myutils
    password: myutils
  data:
    redis:
      host: localhost
      port: 6379
      database: ${TEST_REDIS_DATABASE:0}
  temporal:
    connection:
      enable: true
    test-server:
      enabled: true
    workers-auto-discovery:
      enable: true
      register-activity-beans: true
      workflow-packages:
        - dev.myutils.api.temporal

myutils:
  telegram:
    enabled: true
    bot-token: test-token
    polling-enabled: false
  openrouter:
    api-key: test-key
  temporal:
    enabled: true

TELEGRAM_BOT_TOKEN: test-token
OPENROUTER_API_KEY: test-key
