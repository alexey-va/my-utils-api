when:
  - event: [push, manual]
    branch: main

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myutils
      POSTGRES_USER: myutils
      POSTGRES_PASSWORD: myutils

  - name: redis
    image: redis:7-alpine

steps:
  - name: verify
    image: golang:1.26.5-alpine
    environment:
      TEST_POSTGRES_URL: postgres://myutils:myutils@postgres:5432/myutils?sslmode=disable
    commands:
      - apk add --no-cache bash postgresql-client python3
      - until pg_isready -h postgres -U myutils -d myutils; do sleep 1; done
      # Establish the shared integration schema before Go runs packages in parallel.
      - go test ./internal/migrate -run TestRunnerAppliesFlywaySchemaAndIsIdempotent -count=1
      - go test ./... -count=1
      - go vet ./...
      - CGO_ENABLED=0 go build -trimpath -buildvcs=false ./cmd/my-utils-api

  - name: deploy
    image: docker:27-cli
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/freedeeml/ci:/opt/ci:ro
      - /home/freedeeml/load-secrets.sh:/home/freedeeml/load-secrets.sh:ro
      - /home/freedeeml/.secrets:/home/freedeeml/.secrets:ro
    environment:
      HOME: /home/freedeeml
      MYUTILS_DATASTORE_HOST: 127.0.0.1
    commands:
      - apk add --no-cache bash git
      # The checkout is mounted with a host-side owner. Without this, the
      # deploy script's `git rev-parse HEAD` is rejected as dubious ownership
      # and the image silently falls back to gitCommit=local.
      - git config --global --add safe.directory "$${CI_WORKSPACE}"
      - export WORKSPACE=$${CI_WORKSPACE}
      - bash /opt/ci/deploy-my-utils-api.sh
