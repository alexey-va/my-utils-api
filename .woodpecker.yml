labels:
  deploy-host: vds

when:
  - event: [push, manual]
    branch: main

steps:
  - name: wait-github-ci
    image: alpine:3.23.3
    commands:
      - apk add --no-cache curl jq
      - |
        set -eu
        api="https://api.github.com/repos/alexey-va/my-utils-api/actions/workflows/ci.yml/runs?head_sha=$${CI_COMMIT_SHA}&event=push&per_page=1"
        deadline=$$(($$(date +%s) + 1800))
        while [ "$$(date +%s)" -lt "$$deadline" ]; do
          response=$$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "$$api")
          status=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].status // "missing"')
          conclusion=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].conclusion // ""')
          case "$$status" in
            completed)
              [ "$$conclusion" = success ] && exit 0
              echo "GitHub Actions CI completed with conclusion=$$conclusion" >&2
              exit 1
              ;;
            missing|queued|in_progress|pending|requested|waiting)
              sleep 20
              ;;
            *)
              echo "Unexpected GitHub Actions status=$$status" >&2
              exit 1
              ;;
          esac
        done
        echo "Timed out waiting for GitHub Actions CI" >&2
        exit 1
    when:
      - event: push

  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /srv/my-utils-vds/runtime/api.env:/run/myutils-api.env:ro
    commands:
      - apk add --no-cache bash
      - bash ./deploy-vds.sh "$${CI_COMMIT_SHA}"
