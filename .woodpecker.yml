when:
  - event: [push, manual]
    branch: main

services:
  - name: postgres
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myutils
      POSTGRES_USER: myutils
      POSTGRES_PASSWORD: myutils

  - name: redis
    image: redis:7-alpine

steps:
  - name: verify
    image: gradle:9.4.1-jdk21
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/myutils
      SPRING_DATASOURCE_USERNAME: myutils
      SPRING_DATASOURCE_PASSWORD: myutils
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    commands:
      - gradle --no-daemon --max-workers=1 test

  - name: deploy
    image: docker:27-cli
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/freedeeml/ci:/opt/ci:ro
      - /home/freedeeml/load-secrets.sh:/home/freedeeml/load-secrets.sh:ro
      - /home/freedeeml/.secrets:/home/freedeeml/.secrets:ro
    environment:
      HOME: /home/freedeeml
      MYUTILS_DATASTORE_HOST: 127.0.0.1
    commands:
      - apk add --no-cache bash git
      - export WORKSPACE=$${CI_WORKSPACE}
      - bash /opt/ci/deploy-my-utils-api.sh
