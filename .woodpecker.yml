when:
  - event: [push, manual]
    branch: main

steps:
  - name: wait-github-ci
    image: alpine:3.23.3
    commands:
      - apk add --no-cache curl jq
      - |
        set -eu
        api="https://api.github.com/repos/alexey-va/my-utils-api/actions/workflows/ci.yml/runs?head_sha=$${CI_COMMIT_SHA}&event=push&per_page=1"
        deadline=$$(($$(date +%s) + 1800))
        while [ "$$(date +%s)" -lt "$$deadline" ]; do
          response=$$(curl --fail --silent --show-error -H 'Accept: application/vnd.github+json' "$$api")
          status=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].status // "missing"')
          conclusion=$$(printf '%s' "$$response" | jq -r '.workflow_runs[0].conclusion // ""')
          case "$$status" in
            completed)
              [ "$$conclusion" = success ] && exit 0
              echo "GitHub Actions CI completed with conclusion=$$conclusion" >&2
              exit 1
              ;;
            missing|queued|in_progress|pending|requested|waiting)
              sleep 20
              ;;
            *)
              echo "Unexpected GitHub Actions status=$$status" >&2
              exit 1
              ;;
          esac
        done
        echo "Timed out waiting for GitHub Actions CI" >&2
        exit 1
    when:
      - event: push

  - name: deploy
    image: docker:27-cli
    network_mode: host
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /home/freedeeml/ci:/opt/ci:ro
      - /home/freedeeml/load-secrets.sh:/home/freedeeml/load-secrets.sh:ro
      - /home/freedeeml/.secrets:/home/freedeeml/.secrets:ro
    environment:
      HOME: /home/freedeeml
      MYUTILS_DATASTORE_HOST: 127.0.0.1
    commands:
      - apk add --no-cache bash git
      # The checkout is mounted with a host-side owner. Without this, the
      # deploy script's `git rev-parse HEAD` is rejected as dubious ownership
      # and the image silently falls back to gitCommit=local.
      - git config --global --add safe.directory "$${CI_WORKSPACE}"
      - export WORKSPACE=$${CI_WORKSPACE}
      - bash /opt/ci/deploy-my-utils-api.sh
      - |
        set -eu
        container=my-utils-api-api-1
        deadline=$$(($$(date +%s) + 180))
        while [ "$$(date +%s)" -lt "$$deadline" ]; do
          state=$$(docker inspect -f '{{.State.Status}}' "$$container" 2>/dev/null || true)
          health=$$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$$container" 2>/dev/null || true)
          restart=$$(docker inspect -f '{{.HostConfig.RestartPolicy.Name}}' "$$container" 2>/dev/null || true)
          revision=$$(docker inspect -f '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$$container" 2>/dev/null || true)
          if [ "$$state" = running ] && [ "$$health" = healthy ] && [ "$$restart" = unless-stopped ] && [ "$$revision" = "$${CI_COMMIT_SHA}" ]; then
            echo "Backend deployed healthy at revision $$revision with restart=$$restart"
            exit 0
          fi
          sleep 2
        done
        docker inspect "$$container" --format 'state={{.State.Status}} health={{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}} restarts={{.RestartCount}} restart={{.HostConfig.RestartPolicy.Name}} revision={{index .Config.Labels "org.opencontainers.image.revision"}}' >&2 || true
        exit 1
