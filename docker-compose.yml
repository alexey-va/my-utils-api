services:
  temporal-postgresql:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    restart: unless-stopped
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "false"
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.36.0
    restart: unless-stopped
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_UI_PUBLIC_PATH: /temporal
      TEMPORAL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:13082
    ports:
      - "8233:8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-local}
    image: my-utils-api:local
    labels:
      - "logging=promtail"
      - "app=my-utils-api"
      - "org.opencontainers.image.revision=${GIT_COMMIT:-local}"
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: myutils
      POSTGRES_USER: myutils
      POSTGRES_PASSWORD: myutils
      REDIS_HOST: ${REDIS_HOST:-host.docker.internal}
      REDIS_PORT: ${REDIS_PORT:-6379}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      TELEGRAM_FILE_UPLOAD_TOKEN: ${TELEGRAM_FILE_UPLOAD_TOKEN:-}
      MYUTILS_VPN_TELEGRAM_ENABLED: ${MYUTILS_VPN_TELEGRAM_ENABLED:-false}
      MYUTILS_VPN_TELEGRAM_POLLING_ENABLED: ${MYUTILS_VPN_TELEGRAM_POLLING_ENABLED:-true}
      VPN_TELEGRAM_BOT_TOKEN: ${VPN_TELEGRAM_BOT_TOKEN:-}
      VPN_TELEGRAM_ADMIN_USER_IDS: ${VPN_TELEGRAM_ADMIN_USER_IDS:-}
      VPN_TELEGRAM_RELAY_ID: ${VPN_TELEGRAM_RELAY_ID:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PROXY_ENABLED: ${OPENROUTER_PROXY_ENABLED:-false}
      OPENROUTER_PROXY_HOST: ${OPENROUTER_PROXY_HOST:-}
      OPENROUTER_PROXY_PORT: ${OPENROUTER_PROXY_PORT:-8888}
      WIREGUARD_CREDENTIALS_ENCRYPTION_KEY: ${WIREGUARD_CREDENTIALS_ENCRYPTION_KEY:-}
      MYUTILS_TEMPORAL_ENABLED: ${MYUTILS_TEMPORAL_ENABLED:-false}
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/my-utils-api", "healthcheck"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 8
    restart: unless-stopped

volumes:
  temporal_postgres_data:
