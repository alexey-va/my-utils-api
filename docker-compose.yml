services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: myutils
      POSTGRES_USER: myutils
      POSTGRES_PASSWORD: myutils
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myutils -d myutils"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.27.2
    depends_on:
      temporal-postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
      ENABLE_ES: "false"
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.36.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8233:8080"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-utils-api:local
    env_file:
      - path: .env
        required: false
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: myutils
      POSTGRES_USER: myutils
      POSTGRES_PASSWORD: myutils
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_USER_IDS: ${TELEGRAM_ALLOWED_USER_IDS:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_PROXY_ENABLED: ${OPENROUTER_PROXY_ENABLED:-false}
      OPENROUTER_PROXY_HOST: ${OPENROUTER_PROXY_HOST:-}
      OPENROUTER_PROXY_PORT: ${OPENROUTER_PROXY_PORT:-8888}
      MYUTILS_TEMPORAL_ENABLED: ${MYUTILS_TEMPORAL_ENABLED:-true}
      TEMPORAL_TARGET: ${TEMPORAL_TARGET:-temporal:7233}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      temporal:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 5s
      start_period: 45s
      retries: 8
    restart: unless-stopped

volumes:
  postgres_data:
  temporal_postgres_data:
