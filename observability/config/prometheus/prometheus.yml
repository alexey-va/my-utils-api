# Prometheus on utils (51.250.112.232). Node dashboards expect job="node-exporter".
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: my-utils-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:18080"]
        labels:
          app: my-utils-api

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
        labels:
          service_name: utils
          role: monitoring
      - targets: ["31.44.9.177:9100"]
        labels:
          service_name: velocity
          role: proxy
      - targets: ["178.44.115.21:26800"]
        labels:
          service_name: gercena
          role: backend

  - job_name: mc-paper
    metrics_path: /metrics
    static_configs:
      - targets: ["178.44.115.21:26801"]
        labels:
          server_name: spawn
      - targets: ["178.44.115.21:26802"]
        labels:
          server_name: survival

  - job_name: mc-arc
    metrics_path: /metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["178.44.115.21:26804"]
        labels:
          server_name: spawn
      - targets: ["178.44.115.21:26805"]
        labels:
          server_name: survival
      - targets: ["178.44.115.21:26806"]
        labels:
          server_name: parkour

  - job_name: mc-proxyarc
    metrics_path: /proxyarc/metrics
    scrape_interval: 30s
    static_configs:
      - targets: ["31.44.9.177:9100"]
        labels:
          server_name: velocity

  - job_name: blackbox_minecraft
    metrics_path: /probe
    params:
      module: [minecraft]
    static_configs:
      - targets:
          - 31.44.9.177:25565
        labels:
          alias: velocity
      - targets:
          - 178.44.115.21:26000
        labels:
          alias: spawn
      - targets:
          - 178.44.115.21:26001
        labels:
          alias: survival
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://route.alexeyav.ru
        labels:
          alias: route
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115
