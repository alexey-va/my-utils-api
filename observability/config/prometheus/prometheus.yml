global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: my-utils-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["127.0.0.1:18080", "127.0.0.1:8080"]
        labels:
          app: my-utils-api

  - job_name: node-exporter
    static_configs:
      - targets: ["127.0.0.1:9100"]
