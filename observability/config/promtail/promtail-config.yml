server:
  http_listen_port: 3110
  grpc_listen_port: 9086

positions:
  filename: /var/lib/promtail/positions.yaml

clients:
  - url: http://localhost:3100/loki/api/v1/push

scrape_configs:
  # Docker containers labeled logging=promtail (my-utils-api, etc.)
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_logging"]
        regex: promtail
        action: keep
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_label_app"]
        target_label: app
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: compose_project
    pipeline_stages:
      - match:
          selector: '{app="my-utils-api"}'
          stages:
            - drop:
                expression: '^\s*$'
            - drop:
                expression: '^\{"id":"gen-'
            - match:
                selector: '{app="my-utils-api"} !~ "^\\{"'
                action: drop
            - json:
                expressions:
                  level: level
                  message: message
                  logger: logger_name
                  ts: '"@timestamp"'
            - timestamp:
                source: ts
                format: RFC3339Nano
            - labels:
                level:
                logger:
      - match:
          selector: '{app!="my-utils-api"}'
          stages:
            - regex:
                expression: '^\S+\s+(?P<level>INFO|WARN|ERROR|DEBUG|TRACE)\s+'
            - labels:
                level:

  # Host syslog
  - job_name: host_syslogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: host_auth_logs
          __path__: /var/log/auth.log
      - targets:
          - localhost
        labels:
          job: host_syslogs
          __path__: /var/log/syslog
