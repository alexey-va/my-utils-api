apiVersion: 1

datasources:
  - name: Loki
    type: loki
    uid: bedlw839mzuo0d
    access: proxy
    url: http://127.0.0.1:3100
    isDefault: true
    jsonData:
      maxLines: 500

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://127.0.0.1:9090
    isDefault: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://127.0.0.1:3200
    isDefault: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: bedlw839mzuo0d
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        filterByTraceID: true
        filterBySpanID: false
      tracesToMetrics:
        datasourceUid: prometheus
      serviceMap:
        datasourceUid: prometheus
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: bedlw839mzuo0d
