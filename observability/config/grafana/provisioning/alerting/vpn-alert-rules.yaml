apiVersion: 1
groups:
  - orgId: 1
    name: vpn-data-plane
    folder: My Utils
    interval: 30s
    rules:
      - uid: vpnmetrics01
        title: VPN metrics unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_collection_success
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 1
        noDataState: Alerting
        execErrState: KeepLast
        for: 2m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '1'
          summary: API metrics или состояние WireGuard collector недоступны
          description: Проверь scrape API и чтение состояния WireGuard из PostgreSQL.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&viewPanel=1
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&viewPanel=1
        labels: {severity: critical, team: vpn}
        isPaused: false
        notification_settings: &vpn_critical_notifications
          receiver: Metal Discord
          group_by: [alertname, relay]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h

      - uid: vpnrelay02
        title: VPN relay unavailable
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_relay_ready
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 2
        noDataState: KeepLast
        execErrState: KeepLast
        for: 1m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '2'
          summary: Relay data plane is not READY
          description: Routing, DNS, desired state или health выхода удерживают relay вне READY.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=2
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=2
        labels: {severity: critical, team: vpn}
        isPaused: false
        notification_settings: *vpn_critical_notifications

      - uid: vpnagent03
        title: VPN agent stale
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: time() - myutils_wireguard_agent_last_seen_timestamp_seconds
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [45], type: gt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 3
        noDataState: OK
        execErrState: KeepLast
        for: 1m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '3'
          summary: Relay agent heartbeat is older than 45 seconds
          description: Состояние хоста давно не поступало в API; проверь timer агента.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=3
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=3
        labels: {severity: critical, team: vpn}
        isPaused: false
        notification_settings: *vpn_critical_notifications

      - uid: vpnroute04
        title: VPN routing unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_routing_healthy
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 4
        noDataState: OK
        execErrState: KeepLast
        for: 1m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '4'
          summary: Policy routing or private client DNS is unhealthy
          description: Агент relay не прошёл текущие проверки policy routing и DNS.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=4
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=4
        labels: {severity: critical, team: vpn}
        isPaused: false
        notification_settings: *vpn_critical_notifications

      - uid: vpnexits05
        title: VPN all exits down
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: sum by (relay_id, relay) (myutils_wireguard_exit_healthy)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 5
        noDataState: OK
        execErrState: KeepLast
        for: 30s
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '5'
          summary: Neither AWG exit passes the real egress probe
          description: Внешний трафик закрыт, пока хотя бы один exit не восстановится.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=5
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=5
        labels: {severity: critical, team: vpn}
        isPaused: false
        notification_settings: *vpn_critical_notifications

      - uid: vpnprimary06
        title: VPN primary exit unhealthy
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_exit_healthy{exit="primary"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [1], type: lt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 6
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '6'
          summary: Primary AWG exit failed its handshake or expected-egress probe
          description: Резерв может нести трафик, но отказоустойчивость провайдера снижена.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=6
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=6
        labels: {severity: warning, team: vpn}
        isPaused: false
        notification_settings: &vpn_warning_notifications
          receiver: Metal Discord
          group_by: [alertname, relay]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h

      - uid: vpnreserve07
        title: VPN running on reserve
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 300, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_exit_selected{exit="secondary"} == 1 and on(relay_id, relay) myutils_wireguard_exit_preference{preference="AUTO"} == 1
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [0.5], type: gt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 7
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '7'
          summary: Automatic failover is using the secondary exit
          description: Режим AUTO выбрал резерв; проверь primary, если это состояние длится.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=7
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=7
        labels: {severity: warning, team: vpn}
        isPaused: false
        notification_settings: *vpn_warning_notifications

      - uid: vpnloss08
        title: VPN packet loss high
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: myutils_wireguard_route_packet_loss_percent
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: {params: [20], type: gt}
                  operator: {type: and}
                  reducer: {type: last}
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              refId: C
              type: threshold
        dashboardUid: myutils-vpn-health
        panelId: 8
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          __dashboardUid__: myutils-vpn-health
          __panelId__: '8'
          summary: Route probe packet loss stayed above 20 percent
          description: По label path отличай деградацию Internal от External транспорта.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}
          panel_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=8
          runbook_url: https://utils.alexeyav.ru/grafana/d/myutils-vpn-health/vpn-health?orgId=1&var-relay={{ $labels.relay | urlquery }}&viewPanel=8
        labels: {severity: warning, team: vpn}
        isPaused: false
        notification_settings: *vpn_warning_notifications
