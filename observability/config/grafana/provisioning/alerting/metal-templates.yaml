apiVersion: 1
templates:
  - orgId: 1
    name: metal-discord
    template: |
      {{ define "metal.hostName" -}}
      {{- or .Labels.source .Labels.service_name .Labels.relay .Labels.alias .Labels.server_name "неизвестный хост" -}}
      {{ end }}

      {{ define "metal.issueTitle" -}}
      {{- $name := .Labels.alertname -}}
      {{- if eq $name "Metal host unreachable" -}}Хост недоступен
      {{- else if eq $name "Metal CPU high" -}}Высокая загрузка CPU
      {{- else if eq $name "Metal memory high" -}}Заканчивается память
      {{- else if eq $name "Metal disk full" -}}Заканчивается место на диске
      {{- else if eq $name "VPN metrics unavailable" -}}Недоступны метрики VPN
      {{- else if eq $name "VPN relay unavailable" -}}Недоступен VPN relay
      {{- else if eq $name "VPN agent stale" -}}Устарел heartbeat VPN agent
      {{- else if eq $name "VPN routing unhealthy" -}}Нездоровая маршрутизация VPN
      {{- else if eq $name "VPN all exits down" -}}Оба VPN выхода недоступны
      {{- else if eq $name "VPN primary exit unhealthy" -}}Недоступен primary VPN exit
      {{- else if eq $name "VPN running on reserve" -}}VPN работает через reserve exit
      {{- else if eq $name "VPN packet loss high" -}}Высокая потеря пакетов VPN
      {{- else -}}{{ $name }}
      {{- end -}}
      {{ end }}

      {{ define "metal.issueDetail" -}}
      {{- $name := .Labels.alertname -}}
      {{- if eq $name "Metal host unreachable" -}}node-exporter не отвечает; проверь хост и агент метрик.
      {{- else if eq $name "Metal CPU high" -}}Загрузка CPU выше 90% в течение пяти минут.
      {{- else if eq $name "Metal memory high" -}}Использование памяти выше 90%; возможен OOM.
      {{- else if eq $name "Metal disk full" -}}Корневая файловая система заполнена выше 85%.
      {{- else if eq $name "VPN metrics unavailable" -}}API не может отдать сохранённое состояние WireGuard в Prometheus.
      {{- else if eq $name "VPN relay unavailable" -}}Data plane relay не находится в состоянии READY.
      {{- else if eq $name "VPN agent stale" -}}VPN agent перестал передавать свежее состояние хоста.
      {{- else if eq $name "VPN routing unhealthy" -}}Проверки policy routing или private DNS не прошли.
      {{- else if eq $name "VPN all exits down" -}}Ни один AWG exit не проходит probe; внешний трафик закрыт.
      {{- else if eq $name "VPN primary exit unhealthy" -}}Primary provider нездоров; резерв пока может нести трафик.
      {{- else if eq $name "VPN running on reserve" -}}В режиме AUTO выбран secondary exit; проверь primary.
      {{- else if eq $name "VPN packet loss high" -}}Потеря пакетов Internal или External пути выше 20%.
      {{- else if .Annotations.summary -}}{{ .Annotations.summary }}
      {{- else -}}Проверь панель и состояние источника метрик.
      {{- end -}}
      {{ end }}

      {{ define "metal.value" -}}
      {{- $found := false -}}
      {{- range $ref, $value := .Values -}}
      {{- if eq $ref "B" -}}{{- $found = true -}}{{ if ge $value 0.0 }}`{{ printf "%v" $value }}`{{ else }}`недоступно`{{ end -}}{{- end -}}
      {{- end -}}
      {{- if not $found -}}`недоступно`{{- end -}}
      {{ end }}

      {{ define "metal.alertBody" -}}
      **Проблема:** {{ template "metal.issueTitle" . }}
      **Источник:** `{{ or .Labels.source .Labels.service_name .Labels.relay .Labels.alias "Prometheus" }}`
      **Фактическое значение:** {{ template "metal.value" . }}
      **Описание:** {{ template "metal.issueDetail" . }}
      {{- if .Annotations.description }} {{ .Annotations.description }}{{ end }}
      **Время:** {{ if eq .Status "resolved" }}{{ .EndsAt | date "02.01.2006 15:04 UTC" }}{{ else }}{{ .StartsAt | date "02.01.2006 15:04 UTC" }}{{ end }}
      {{ end }}

      {{ define "metal.alert.firing" -}}
      **Хост:** `{{ template "metal.hostName" . }}`
      {{ template "metal.alertBody" . }}
      **Дашборд:** [открыть]({{ or .Annotations.dashboard_url .DashboardURL }})
      **Панель:** [открыть]({{ or .Annotations.panel_url .PanelURL .Annotations.dashboard_url .DashboardURL }})
      {{ end }}

      {{ define "metal.alert.resolved" -}}
      ✅ **Восстановлено:** `{{ template "metal.hostName" . }}` · {{ template "metal.issueTitle" . }}
      {{ template "metal.alertBody" . }}
      **Дашборд:** [открыть]({{ or .Annotations.dashboard_url .DashboardURL }})
      **Панель:** [открыть]({{ or .Annotations.panel_url .PanelURL .Annotations.dashboard_url .DashboardURL }})
      {{ end }}

      {{ define "metal.discord.title" -}}
      {{- if eq .Status "resolved" -}}✅ Восстановлено: {{ len .Alerts.Resolved }}{{- else -}}🔴 Срабатывание: {{ len .Alerts.Firing }}{{- end -}}
      {{ end }}

      {{ define "metal.discord.message" -}}
      {{- range .Alerts.Firing }}{{ template "metal.alert.firing" . }}
      {{ end -}}
      {{- range .Alerts.Resolved }}{{ template "metal.alert.resolved" . }}
      {{ end -}}
      {{ end }}

      {{ define "metal.discord.payload" -}}
      {{- $embeds := coll.Slice -}}
      {{- range $a := .Alerts -}}
      {{- $url := or $a.Annotations.dashboard_url $a.PanelURL $a.DashboardURL "https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1" -}}
      {{- $body := tmpl.Exec "metal.alertBody" $a -}}
      {{- $state := "🔴" -}}{{- if eq $a.Status "resolved" }}{{ $state = "✅ Восстановлено" }}{{ else if eq $a.Labels.severity "warning" }}{{ $state = "⚠️" }}{{ end -}}
      {{- $title := printf "%.180s" (printf "%s %s · %s" $state (tmpl.Exec "metal.hostName" $a) (tmpl.Exec "metal.issueTitle" $a)) -}}
      {{- $dashboard := or $a.Annotations.dashboard_url $a.DashboardURL "https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1" -}}
      {{- $panel := or $a.Annotations.panel_url $a.PanelURL $dashboard -}}
      {{- $body = printf "%.500s\n**Дашборд:** [открыть](%s)\n**Панель:** [открыть](%s)" $body $dashboard $panel -}}
      {{- $color := 15158332 -}}{{- if eq $a.Status "resolved" }}{{ $color = 3066993 }}{{ else if eq $a.Labels.severity "warning" }}{{ $color = 16705372 }}{{ end -}}
      {{- $embeds = coll.Append (coll.Dict "title" $title "url" $url "description" $body "color" $color) $embeds -}}
      {{- end -}}
      {{- $content := "" -}}{{- $truncated := data.ToJSON .TruncatedAlerts -}}
      {{- if and (ne $truncated "null") (ne $truncated "0") }}{{ $content = printf "Показаны первые %d тревог; ещё %s скрыты лимитом webhook." (len .Alerts) $truncated }}{{ end -}}
      {{- coll.Dict "content" $content "embeds" $embeds "allowed_mentions" (coll.Dict "parse" (coll.Slice)) | data.ToJSON -}}
      {{- end }}
