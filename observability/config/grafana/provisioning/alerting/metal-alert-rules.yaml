apiVersion: 1
groups:
  - orgId: 1
    name: metal-hardware
    folder: My Utils
    interval: 1m
    rules:
      - uid: efqg6umajocg0c
        title: Metal host unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="node-exporter"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: node-exporter not responding
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: dfqg6wqbqesxse
        title: Metal CPU high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * (1 - avg by (instance, service_name) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: CPU above 90% for 5 minutes
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: cfqg6wy89uewwf
        title: Metal memory high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        noDataState: OK
        execErrState: Alerting
        for: 5m
        annotations:
          summary: RAM above 90% for 5 minutes
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: afqg6x9q6ipkwe
        title: Metal disk full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!="rootfs"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        noDataState: OK
        execErrState: Alerting
        for: 10m
        annotations:
          summary: root disk above 85% for 10 minutes
        labels:
          severity: warning
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
      - uid: bfqg6service01
        title: Metal service unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: max by (alias) (probe_success{alias=~"velocity|spawn|survival|route"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        noDataState: Alerting
        execErrState: Alerting
        for: 2m
        annotations:
          summary: blackbox probe failed for 2+ minutes
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - alias
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
