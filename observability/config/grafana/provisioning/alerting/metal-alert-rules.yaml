apiVersion: 1
deleteRules:
  - orgId: 1
    uid: bfqg6service01
groups:
  - orgId: 1
    name: metal-hardware
    folder: My Utils
    interval: 1m
    rules:
      - uid: efqg6umajocg0c
        title: Metal host unreachable
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: up{job="node-exporter"}
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        panelId: 157
        noDataState: OK
        execErrState: OK
        for: 3m
        annotations:
          __dashboardUid__: rYdddlPWk
          __panelId__: '157'
          summary: node-exporter не отвечает
          description: Метрики узла недоступны; проверь node-exporter и сам хост.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}
          panel_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=157
          runbook_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=157
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: dfqg6wqbqesxse
        title: Metal CPU high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 * (1 - avg by (instance, service_name) (rate(node_cpu_seconds_total{job="node-exporter",mode="idle"}[5m])))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        panelId: 77
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          __dashboardUid__: rYdddlPWk
          __panelId__: '77'
          summary: CPU выше 90% пять минут
          description: Загрузка CPU держится выше порога; проверь процессы на узле.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}
          panel_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=77
          runbook_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=77
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: cfqg6wy89uewwf
        title: Metal memory high
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: (1 - (node_memory_MemAvailable_bytes{job="node-exporter"} / node_memory_MemTotal_bytes{job="node-exporter"})) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        panelId: 78
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        annotations:
          __dashboardUid__: rYdddlPWk
          __panelId__: '78'
          summary: Память выше 90% пять минут
          description: Доступная память держится ниже порога; проверь потребителей RAM.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}
          panel_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=78
          runbook_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=78
        labels:
          severity: critical
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 4h
      - uid: afqg6x9q6ipkwe
        title: Metal disk full
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              datasource:
                type: prometheus
                uid: prometheus
              editorMode: code
              expr: 100 - ((node_filesystem_avail_bytes{job="node-exporter",mountpoint="/",fstype!="rootfs"} * 100) / node_filesystem_size_bytes{job="node-exporter",mountpoint="/",fstype!="rootfs"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  reducer:
                    type: last
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        dashboardUid: rYdddlPWk
        panelId: 152
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        annotations:
          __dashboardUid__: rYdddlPWk
          __panelId__: '152'
          summary: Корневой диск заполнен выше 85%
          description: Использование корневой файловой системы держится выше порога.
          dashboard_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}
          panel_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=152
          runbook_url: https://utils.alexeyav.ru/grafana/d/rYdddlPWk/metal-status?orgId=1&var-host={{ $labels.service_name }}&var-node={{ $labels.instance }}&viewPanel=152
        labels:
          severity: warning
          team: metal
        isPaused: false
        notification_settings:
          receiver: Metal Discord
          group_by:
            - alertname
            - service_name
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 6h
