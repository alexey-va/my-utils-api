name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: myutils
          POSTGRES_USER: myutils
          POSTGRES_PASSWORD: myutils
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myutils -d myutils"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgres://myutils:myutils@localhost:5432/myutils?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Prepare integration schema
        run: go test ./internal/migrate -run TestRunnerAppliesFlywaySchemaAndIsIdempotent -count=1
      - name: Test
        run: go test ./... -count=1
      - name: Vet
        run: go vet ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -buildvcs=false ./cmd/my-utils-api
